# Runs gitleaks on what you are about to commit.
# One-time setup on a Mac (details in README.md):
#   brew install pre-commit
#   pre-commit install
# GitHub also scans every push and pull request.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
